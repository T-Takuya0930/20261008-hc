<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/style.css">
	<title>名言集</title>
</head>
<body>
    <div class="wrapper">
        <h1>名言集</h1>
        <div class="left-box">
            <figure>
                <img src="images/horie-2.jpg" alt="堀江貴文-1">
                <figcaption>堀江貴文</figcaption>
            </figure>
            <p>
                「突き抜けられる人とそうでない人の違いは次の一点に尽きる。物事を「できない理由」から考えるのか、それとも「できる理由」から考えるのか。それだけだ。」
            </p>
        </div>

        <div class="right-box">
            <figure>
                <img src="images/horie-1.jpg" alt="堀江貴文-2">
                <figcaption>堀江貴文</figcaption>
            </figure>
            <p>
                「信用は、とても曖昧なものであり、自信さえあれば、誤魔化しやハッタリが効く<br><br>
                自分を不必要に大きく見せる必要はないが、小さく見せることもない」
            </p>
        </div>

        <div class="center-box">
            <figure>
                <img src="images/yasai.webp" alt="ホリエモン">
                <figcaption>ホリエモン</figcaption>
            </figure>
            <p>
                「野菜は美味しいから食べるんだよ<br>
                野菜食べて偉いとか、野菜を不味い食べ物だと思ってるから出てくる言葉だろ？あ？<br>
                野菜は美味しい食べ物なんだよ○○が」
            </p>
        </div>
    </div>
</body>
</html>
